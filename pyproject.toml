[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mavats"
version = "0.2.0a2"
description = "Scientific methods for matrix- and tensor-valued time series"
authors = [{name = "Daniel", email = "danlixuan@gmail.com"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.13"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Repository = "https://github.com/dx-li/MaVaTS"
Documentation = "https://dx-li.github.io/MaVaTS/mavats.html"
Issues = "https://github.com/dx-li/MaVaTS/issues"

[project.optional-dependencies]
dev = ["pytest>=8.2,<10", "pytest-cov>=5", "black>=24.4,<27", "isort>=5.13", "build>=1", "twine>=6,<7"]
docs = ["pdoc>=15"]
examples = ["matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
include = ["mavats*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.isort]
profile = "black"

[tool.black]
target-version = ["py310"]

[tool.coverage.run]
source = ["mavats"]

[tool.coverage.report]
show_missing = true
