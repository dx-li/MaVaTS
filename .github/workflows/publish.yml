name: Publish to PyPI

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require release tags to point to main history
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Validate version and tag
        run: |
          python - <<'PY'
          import ast, os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          tree = ast.parse(Path('mavats/__init__.py').read_text())
          source_version = next(ast.literal_eval(n.value) for n in tree.body
              if isinstance(n, ast.Assign)
              and any(isinstance(t, ast.Name) and t.id == '__version__' for t in n.targets))
          assert source_version == version, (source_version, version)
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version
          print('Validated release version:', version)
          PY
      - run: python -m pip install '.[dev,examples]'
      - run: python -m pytest
      - run: python -m build --outdir release-dist
      - run: python -m twine check --strict release-dist/*
      - name: Validate distribution metadata and source contents
        run: |
          python - <<'PY'
          import email, tarfile, tomllib, zipfile
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          root = Path('release-dist')
          wheels, sources = list(root.glob('*.whl')), list(root.glob('*.tar.gz'))
          assert len(wheels) == len(sources) == 1
          assert len(list(root.iterdir())) == 2
          with zipfile.ZipFile(wheels[0]) as wheel:
              metadata = next(n for n in wheel.namelist() if n.endswith('.dist-info/METADATA'))
              assert email.message_from_bytes(wheel.read(metadata))['Version'] == version
              for source in Path('mavats').glob('*.py'):
                  assert wheel.read(source.as_posix()) == source.read_bytes(), source
          with tarfile.open(sources[0]) as archive:
              prefix = 'mavats-' + version + '/'
              metadata = archive.extractfile(prefix + 'PKG-INFO').read()
              assert email.message_from_bytes(metadata)['Version'] == version
              required = [Path('README.md'), Path('LICENSE'), Path('CHANGELOG.md')]
              for folder, pattern in [('mavats', '*.py'), ('docs', '*.md'),
                                      ('docs', '*.bib'), ('examples', '*.py'),
                                      ('benchmarks', '*.py')]:
                  required.extend(Path(folder).rglob(pattern))
              for folder, extensions in [('docs/gallery', {'.png', '.json', '.npz'}),
                                         ('examples/air_quality/data', {'.csv', '.json', '.md'})]:
                  required.extend(p for p in Path(folder).rglob('*')
                                  if p.is_file() and p.suffix in extensions)
              for source in required:
                  assert archive.extractfile(prefix + source.as_posix()).read() == source.read_bytes(), source
          print('Verified wheel/source metadata and packaged code, guides, citations and examples')
          PY
      - name: Install wheel in isolation and execute every example
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/mavats-release-wheel"
          python - <<'PY'
          import os, pathlib, subprocess
          executable = pathlib.Path(os.environ['RUNNER_TEMP']) / 'mavats-release-wheel/bin/python'
          wheel = next(pathlib.Path('release-dist').glob('*.whl')).resolve()
          subprocess.run([str(executable), '-m', 'pip', 'install', str(wheel) + '[examples]'], check=True)
          PY
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/mavats-release-wheel/bin/python" - <<'PY'
          import importlib.metadata, os, pathlib, tomllib
          import mavats
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          expected = tomllib.loads((root / 'pyproject.toml').read_text())['project']['version']
          assert mavats.__version__ == importlib.metadata.version('mavats') == expected
          assert not pathlib.Path(mavats.__file__).resolve().is_relative_to(root)
          print('Installed wheel:', mavats.__version__, mavats.__file__)
          PY
          for example in "$GITHUB_WORKSPACE"/examples/*.py; do
            "$RUNNER_TEMP/mavats-release-wheel/bin/python" "$example"
          done
          "$RUNNER_TEMP/mavats-release-wheel/bin/python" - --output "$RUNNER_TEMP/mavats-wheel-gallery" <<'PY'
          import os, pathlib, runpy, sys
          import mavats
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          assert not pathlib.Path(mavats.__file__).resolve().is_relative_to(root)
          # Expose only the example package, never the checkout's mavats package.
          sys.path.insert(0, str(root / 'examples'))
          runpy.run_module('air_quality', run_name='__main__')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distributions
          path: release-dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build-and-check
    if: github.repository == 'dx-li/MaVaTS' && startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/mavats/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions
          path: dist/
      - name: Publish validated distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
