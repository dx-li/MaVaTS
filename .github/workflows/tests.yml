name: Numerical tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest --cov=mavats
      - run: python -m benchmarks.run --quick --repeats 1 --output benchmark-smoke.json
      - run: python -m examples.quickstart
      - run: python -m examples.method_gallery
      - run: python -m build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ matrix.os }}-py${{ matrix.python }}
          path: benchmark-smoke.json

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e '.[dev]' 'numpy==1.26.4' 'scipy==1.13.1'
      - run: python -m pytest
