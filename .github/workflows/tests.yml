name: Numerical tests

on:
  push:
    branches: [main]
  pull_request:

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest --cov=mavats
      - run: python -m benchmarks.run --quick --repeats 1 --output benchmark-smoke.json
      - run: python -m benchmarks.matrix_extensions --quick --repeats 1 --output benchmark-extensions-smoke.json
      - run: python -m benchmarks.inference --repeats 2 --sample-sizes 200 --output benchmark-inference-smoke.json
      - run: python -m benchmarks.advanced_matrix --quick --repeats 1 --output benchmark-advanced-smoke.json
      - run: python -m benchmarks.monitoring --quick --repeats 1 --calibration-repeats 99 --output benchmark-monitoring-smoke.json
      - run: python -m benchmarks.structured_ar --quick --repeats 1 --output benchmark-structured-smoke.json
      - run: python -m benchmarks.entrywise_robust --quick --repeats 1 --output benchmark-entrywise-smoke.json
      - run: python -m examples.quickstart
      - run: python -m examples.method_gallery
      - run: python -m examples.sparse_mar
      - run: python -m examples.threshold_factors
      - run: python -m examples.decorrelation
      - run: python -m examples.mar_inference
      - run: python -m examples.two_way_dynamic
      - run: python -m examples.matrix_garch
      - run: python -m examples.online_monitoring
      - run: python -m examples.cointegrated_mar
      - run: python -m examples.tensor_autoregression
      - run: python -m examples.entrywise_huber
      - run: python -m build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            benchmark-smoke.json
            benchmark-extensions-smoke.json
            benchmark-inference-smoke.json
            benchmark-inference-smoke.jsonl
            benchmark-advanced-smoke.json
            benchmark-monitoring-smoke.json
            benchmark-monitoring-smoke.jsonl
            benchmark-structured-smoke.json
            benchmark-entrywise-smoke.json

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e '.[dev]' 'numpy==1.26.4' 'scipy==1.13.1'
      - run: python -m pytest
