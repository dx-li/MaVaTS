name: Real-world documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'

jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev,examples]'
      - run: python -m pytest tests/test_real_world_documentation.py
      - name: Execute all observational walkthroughs offline
        run: python -m examples.air_quality --output /tmp/mavats-gallery
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: real-world-gallery
          path: /tmp/mavats-gallery
          if-no-files-found: error
